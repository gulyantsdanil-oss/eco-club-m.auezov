<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eco Club | EcoGames</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f8f3;color:#173f30;font:16px/1.5 Inter,system-ui,Arial,sans-serif}header{background:linear-gradient(110deg,#083d2e,#168058);color:white;padding:42px max(22px,calc((100% - 1050px)/2))}header h1{font-size:clamp(29px,5vw,48px);margin:0 0 8px}main{max-width:1100px;margin:30px auto;padding:0 18px}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.back{color:#fff;text-decoration:none;display:inline-block;margin-bottom:14px}.switch{margin-left:auto}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 15px;background:#146747;color:white}button[aria-pressed=true]{background:#f4f8ed;color:#145237}header button{background:#ffffff2a;border:1px solid #ffffff58}.card{background:white;border:1px solid #deece2;border-radius:19px;padding:22px;box-shadow:0 8px 24px #134c2310;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.muted{color:#688376}.tag{display:inline-block;background:#e6f4e7;color:#136342;border-radius:30px;font-size:12px;padding:5px 11px;font-weight:750}.options{display:grid;gap:9px;margin:15px 0}.options button{background:#edf4ef;color:#154c34;text-align:left;border:1px solid #d2e7d8}.options button:hover{background:#d4eadb}.options button.selected{background:#126344;color:#fff}.feedback{font-weight:750;min-height:24px}.visual{font-size:54px;padding:13px}footer{text-align:center;color:#70917c;font-size:13px;padding:30px}@media(max-width:640px){header{padding:22px}main{margin:15px auto}}</style></head><body><header><a class="back" href="./index.html">← <span data-i18n="back">Вернуться на Eco Club</span></a><div class="top"><div><h1>EcoGames</h1><p id="description"></p></div><div class="switch"><button data-lang="kk">ҚАЗ</button> <button data-lang="ru">РУС</button></div></div></header><main><div class="card"><span class="tag" id="level"></span><h2 id="question"></h2><div class="options" id="options"></div><p class="feedback" id="feedback" aria-live="polite"></p><button id="next"></button><p class="muted" id="progress"></p></div><div class="card"><h3 id="scoresTitle"></h3><div id="scores"></div></div></main><footer>Eco Club · 2026–2027</footer><script>const data={ru:{back:'Вернуться на Eco Club',desc:'Учимся сортировать отходы, находить экологичные решения и проверять знания.',next:'Следующий вопрос →',again:'Начать заново',correct:'✅ Правильно!',wrong:'❌ Попробуй ещё раз',task:'Экологическая викторина',progress:'Вопрос',score:'Результат',finish:'Игра завершена'},kk:{back:'Eco Club сайтына оралу',desc:'Қалдықтарды сұрыптауды үйреніп, экологиялық шешімдерді табамыз.',next:'Келесі сұрақ →',again:'Қайта бастау',correct:'✅ Дұрыс!',wrong:'❌ Қайта байқап көр',task:'Экологиялық викторина',progress:'Сұрақ',score:'Нәтиже',finish:'Ойын аяқталды'}};const qs=[{ru:['Куда выбрасывать чистую бумагу?',['В контейнер для бумаги','В пищевые отходы','К батарейкам'],0],kk:['Таза қағазды қайда тастайды?',['Қағаз контейнеріне','Тамақ қалдықтарына','Батарейкаларға'],0]},{ru:['Как уменьшить пластиковые отходы?',['Чаще покупать одноразовые пакеты','Использовать многоразовую сумку','Не сортировать пластик'],1],kk:['Пластик қалдықтарын қалай азайтамыз?',['Бірреттік пакеттерді көбірек алу','Көп рет қолданылатын сөмке пайдалану','Пластикті сұрыптамау'],1]},{ru:['Что делать с использованной батарейкой?',['Выбросить в обычную урну','Закопать','Сдать в специальный пункт'],2],kk:['Пайдаланылған батарейканы не істеу керек?',['Қалыпты қоқысқа тастау','Көміп тастау','Арнайы қабылдау орнына өткізу'],2]},{ru:['Что относится к органическим отходам?',['Банановая кожура','Алюминиевая банка','Стеклянная бутылка'],0],kk:['Органикалық қалдыққа не жатады?',['Банан қабығы','Алюминий құты','Шыны бөтелке'],0]},{ru:['Что важно при Waste Audit?',['Сравнивать разные периоды по одной методике','Каждый месяц менять метод подсчёта','Записывать выдуманные цифры'],0],kk:['Waste Audit зерттеуінде не маңызды?',['Бір әдістемемен кезеңдерді салыстыру','Ай сайын өлшеу әдісін ауыстыру','Ойдан сан жазу'],0]},{ru:['Как экономить бумагу в школе?',['Печатать ненужные копии','Использовать двустороннюю печать','Выбрасывать чистые листы'],1],kk:['Мектепте қағазды қалай үнемдейміз?',['Қажетсіз көшірмелер шығару','Екі жақты басып шығару','Таза парақтарды тастау'],1]}];let lang=new URLSearchParams(location.search).get('lang')||'ru';if(!data[lang])lang='ru';let at=0,score=0,answered=false;function render(){let d=data[lang];document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=d[e.dataset.i18n]);document.querySelector('#description').textContent=d.desc;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));let q=qs[at]?.[lang];document.querySelector('#level').textContent=d.task;document.querySelector('#question').textContent=q?q[0]:d.finish;document.querySelector('#options').innerHTML='';if(q)q[1].forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>{if(answered)return;answered=true;b.classList.add('selected');let good=i===q[2];if(good)score++;document.querySelector('#feedback').textContent=good?d.correct:d.wrong;document.querySelector('#scores').textContent=d.score+': '+score+' / '+qs.length};document.querySelector('#options').append(b)});document.querySelector('#next').textContent=at===qs.length?d.again:d.next;document.querySelector('#feedback').textContent='';document.querySelector('#progress').textContent=d.progress+' '+Math.min(at+1,qs.length)+' / '+qs.length;document.querySelector('#scoresTitle').textContent=d.score;document.querySelector('#scores').textContent=score+' / '+qs.length}document.querySelector('#next').onclick=()=>{if(at>=qs.length){at=0;score=0}else{at++}answered=false;render()};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;at=0;score=0;answered=false;render()});render();</script></body></html>
