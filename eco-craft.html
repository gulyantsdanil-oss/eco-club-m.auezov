const copy={kz:{heroTitle:'Қалдықтан пайдалы бұйым жаса!',heroBody:'Қалдықтарға екінші өмір сыйла: идеяны таңда, нұсқаулықты орында және жұмысыңды Eco Club галереясына ұсын.',heroOne:'10 шығармашылық жоба',heroTwo:'Қадамдық нұсқаулықтар',heroThree:'Оқушылар жұмыстары',catalogTitle:'ECOCRAFT шеберханасы',catalogSubtitle:'Бұйымды таңдап, материалдар мен жасалу жолын қара.',search:'Бұйымды іздеу...',all:'Барлық деңгей',easy:'Оңай',medium:'Орташа',hard:'Күрделі',lesson:'сабақ',open:'Нұсқаулықты ашу',safetyIntro:'Назар аудар: суретті нұсқаулықтар үлгі ретінде берілген. Өткір құралдар, банка және пластикті кесу жұмыстары мұғалімнің бақылауымен жасалады.',submitTitle:'Өз жұмысыңды көрсет',submitSub:'Фотоны жібер — мұғалім мақұлдаған соң галереяда пайда болады.',chooseProduct:'Жоба',classGroup:'Сынып (мысалы, 7А)',photoLabel:'Дайын бұйым фотосы',consent:'Мен фотосуретті жіберуге рұқсатым бар екенін растаймын. Фотоға адамдардың беті мен жеке мәліметтері түспейді.',send:'Фотоны жіберу',submitNote:'Формат: JPG, PNG немесе WebP. Жүйе фотоны ықшамдайды. Деректер мұғалім тексергенге дейін жарияланбайды.',galleryTitle:'Оқушылар жұмыстары',gallerySub:'Тек мұғалім мақұлдаған жұмыстар көрсетіледі.',refresh:'Жаңарту',galleryEmpty:'Әзірге мақұлданған фотолар жоқ.',materials:'Қажетті заттар',stepsTitle:'Жасалу жолы',download:'Плакатты ашу / жүктеу',footer:'Шығармашылық арқылы табиғатты қорғаймыз',needSetup:'Фотоларды жіберу үшін Google Apps Script сілтемесін баптау қажет.',sending:'Фото жіберілуде...',success:'Фото қабылданды! Мұғалімнің мақұлдауын күтіңіз.',failure:'Жіберу мүмкін болмады. Қайталап көріңіз.',badFile:'JPG, PNG немесе WebP фотосын таңдаңыз.',tooBig:'Файл тым үлкен. Көлемін азайтыңыз.'},ru:{heroTitle:'Преврати отходы в полезные вещи!',heroBody:'Подари материалам вторую жизнь: выбери идею, следуй инструкции и предложи готовую работу для галереи Eco Club.',heroOne:'10 творческих проектов',heroTwo:'Пошаговые инструкции',heroThree:'Работы учеников',catalogTitle:'Мастерская ECOCRAFT',catalogSubtitle:'Выбери изделие, посмотри материалы и этапы изготовления.',search:'Поиск изделия...',all:'Все уровни',easy:'Легко',medium:'Средне',hard:'Сложно',lesson:'урок(а)',open:'Открыть инструкцию',safetyIntro:'Обратите внимание: плакаты служат иллюстрированными образцами. Работа с острыми инструментами и разрезание пластика или металла должны проходить под контролем учителя.',submitTitle:'Покажи свою работу',submitSub:'Отправь фото — после одобрения учителя оно появится в галерее.',chooseProduct:'Проект',classGroup:'Класс (например, 7А)',photoLabel:'Фото готового изделия',consent:'Я подтверждаю наличие разрешения на отправку фото. На фото нет лиц людей и персональных данных.',send:'Отправить фото',submitNote:'Формат: JPG, PNG или WebP. Изображение сжимается перед отправкой. Данные не публикуются до проверки учителем.',galleryTitle:'Работы учеников',gallerySub:'Показываются только одобренные учителем работы.',refresh:'Обновить',galleryEmpty:'Одобренных работ пока нет.',materials:'Необходимые материалы',stepsTitle:'Пошаговая инструкция',download:'Открыть / скачать плакат',footer:'Заботимся о природе через творчество',needSetup:'Для приёма фото необходимо настроить ссылку Google Apps Script.',sending:'Отправляем фото...',success:'Фото принято! Дождитесь одобрения учителя.',failure:'Не удалось отправить. Попробуйте ещё раз.',badFile:'Выберите JPG, PNG или WebP.',tooBig:'Файл слишком большой. Уменьшите размер.'}};
const requestedLang=new URLSearchParams(location.search).get('lang');let lang=(requestedLang==='kk'||requestedLang==='kz')?'kz':requestedLang==='ru'?'ru':localStorage.getItem('ecocraft-lang')==='kz'?'kz':'ru';const $=id=>document.getElementById(id);const tr=k=>copy[lang][k];const val=a=>a[lang==='kz'?0:1];
function el(tag,className,txt){let n=document.createElement(tag);if(className)n.className=className;if(txt!==undefined)n.textContent=txt;return n}
function render(){document.documentElement.lang=lang==='kz'?'kk':'ru';$('ecoBack').textContent=lang==='kz'?'← Eco Club сайтына оралу':'← Вернуться в Eco Club';document.querySelectorAll('[data-t]').forEach(x=>x.textContent=tr(x.dataset.t));$('langKz').classList.toggle('active',lang==='kz');$('langRu').classList.toggle('active',lang==='ru');$('search').placeholder=tr('search');let sel=$('difficulty'),v=sel.value;sel.replaceChildren();[['',tr('all')],['1',tr('easy')],['2',tr('medium')],['3',tr('hard')]].forEach(([id,name])=>sel.add(new Option(name,id)));sel.value=v;let prod=$('product'),old=prod.value;prod.replaceChildren();projects.forEach(p=>prod.add(new Option(val(p.title),p.id)));if(old)prod.value=old;renderCards();renderGallery();}
function renderCards(){let wrap=$('cards');wrap.replaceChildren();let q=$('search').value.trim().toLocaleLowerCase(),d=$('difficulty').value;let filtered=projects.filter(p=>(!d||String(p.difficulty)===d)&&(!q||p.title.join(' ').toLocaleLowerCase().includes(q)));if(!filtered.length){wrap.append(el('div','empty','—'));return}filtered.forEach((p,i)=>{let card=el('article','card'),pic=el('div','pic'),im=el('img');im.src='assets/'+p.image;im.loading='lazy';im.alt=val(p.title);im.onerror=()=>{im.remove();if(!pic.querySelector('.ecocraft-img-fallback')){let fallback=el('div','ecocraft-img-fallback','♻️ '+val(p.title));pic.prepend(fallback)}};pic.append(im,el('span','num','#'+(projects.indexOf(p)+1)));let body=el('div','cbody');body.append(el('h3','',val(p.title)),el('p','desc',val(p.steps[0])));body.append(el('p','meta',tr(['','easy','medium','hard'][p.difficulty])+' · '+p.time+' '+tr('lesson')));let btn=el('button','btn',tr('open'));btn.type='button';btn.addEventListener('click',()=>openProject(p));body.append(btn);card.append(pic,body);wrap.append(card)})}
function openProject(p){$('modalTitle').textContent=val(p.title);$('modalNumber').textContent='ECOCRAFT / № '+(projects.indexOf(p)+1);$('modalPoster').src='assets/'+p.image;$('modalPoster').onerror=()=>{$('modalPoster').hidden=true;$('downloadPoster').hidden=true};$('modalPoster').onload=()=>{$('modalPoster').hidden=false;$('downloadPoster').hidden=false};$('downloadPoster').href='assets/'+p.image;$('downloadPoster').download=p.image;$('modalMaterials').replaceChildren();p.materials.forEach(m=>$('modalMaterials').append(el('span','',val(m))));$('modalSteps').replaceChildren();p.steps.forEach((s,i)=>{let st=el('div','step');st.append(el('b','',String(i+1)),el('span','',val(s)));$('modalSteps').append(st)});$('modalSafety').textContent=val(p.safety);$('modal').hidden=false;document.body.style.overflow='hidden';$('close').focus()}
function closeModal(){$('modal').hidden=true;document.body.style.overflow=''}
function renderGallery(){let gal=$('gallery');gal.replaceChildren();let list=window.ecocraftApproved||[];if(!list.length){gal.append(el('p','empty',tr('galleryEmpty')));return}list.forEach(p=>{let card=el('article','photoCard'),im=el('img');if(!/^https:\/\//.test(p.imageUrl||''))return;im.src=p.imageUrl;im.loading='lazy';im.alt='EcoCraft';card.append(im,el('p','',(projects.find(t=>t.id===p.project)?.title[lang==='kz'?0:1]||'EcoCraft')+' · '+String(p.classGroup||'').slice(0,15)));gal.append(card)})}
window.ecocraftGalleryCB=function(data){if(data&&Array.isArray(data.items)){window.ecocraftApproved=data.items.slice(0,60);renderGallery()}};
function fetchGallery(){if(!/^https:\/\//.test(CONFIG.apiUrl))return;let s=document.createElement('script');s.src=CONFIG.apiUrl+'?action=gallery&callback=ecocraftGalleryCB&v='+Date.now();s.onerror=()=>s.remove();s.onload=()=>s.remove();document.head.append(s)}
function resizeImage(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=1500,ratio=Math.min(1,max/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.77))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('decode'))};img.src=url})}
window.addEventListener('message',e=>{if(e.source!==$('uploadFrame').contentWindow||!e.data||e.data.type!=='ecocraft-result')return;const st=$('uploadStatus');$('send').disabled=false;if(e.data.ok){st.textContent=tr('success');st.style.color='#16734b';$('submission').reset()}else{st.textContent=tr('failure');st.style.color='#aa372e'}});
$('submission').addEventListener('submit',async e=>{e.preventDefault();let st=$('uploadStatus'),file=$('photo').files[0];if(!/^https:\/\//.test(CONFIG.apiUrl)){st.textContent=tr('needSetup');st.style.color='#a35419';return}if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)){st.textContent=tr('badFile');return}if(file.size>12*1024*1024){st.textContent=tr('tooBig');return}st.textContent=tr('sending');st.style.color='#276950';$('send').disabled=true;try{let b64=await resizeImage(file);if(b64.length>3.5*1024*1024)throw Error('big');let data={project:$('product').value,classGroup:$('classGroup').value.trim(),imageData:b64,consent:$('consent').checked,kind:'ecocraft'};let form=document.createElement('form');form.method='POST';form.action=CONFIG.apiUrl;form.target='ecocraftUploadFrame';form.style.display='none';let inp=document.createElement('input');inp.type='hidden';inp.name='payload';inp.value=JSON.stringify(data);form.append(inp);document.body.append(form);form.submit();form.remove();setTimeout(()=>{if($('send').disabled){$('send').disabled=false;st.textContent=tr('failure')}},25000)}catch(err){$('send').disabled=false;st.textContent=err.message==='big'?tr('tooBig'):tr('failure');st.style.color='#aa372e'}});
$('langKz').onclick=()=>{lang='kz';localStorage.setItem('ecocraft-lang',lang);render()};$('langRu').onclick=()=>{lang='ru';localStorage.setItem('ecocraft-lang',lang);render()};$('search').addEventListener('input',renderCards);$('difficulty').addEventListener('change',renderCards);$('close').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('refresh').onclick=fetchGallery;render();fetchGallery();
</script></body></html>
