<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eco Club | EcoCraft</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f8f3;color:#173f30;font:16px/1.5 Inter,system-ui,Arial,sans-serif}header{background:linear-gradient(110deg,#083d2e,#168058);color:white;padding:42px max(22px,calc((100% - 1050px)/2))}header h1{font-size:clamp(29px,5vw,48px);margin:0 0 8px}main{max-width:1100px;margin:30px auto;padding:0 18px}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.back{color:#fff;text-decoration:none;display:inline-block;margin-bottom:14px}.switch{margin-left:auto}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 15px;background:#146747;color:white}button[aria-pressed=true]{background:#f4f8ed;color:#145237}header button{background:#ffffff2a;border:1px solid #ffffff58}.card{background:white;border:1px solid #deece2;border-radius:19px;padding:22px;box-shadow:0 8px 24px #134c2310;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.muted{color:#688376}.tag{display:inline-block;background:#e6f4e7;color:#136342;border-radius:30px;font-size:12px;padding:5px 11px;font-weight:750}.options{display:grid;gap:9px;margin:15px 0}.options button{background:#edf4ef;color:#154c34;text-align:left;border:1px solid #d2e7d8}.options button:hover{background:#d4eadb}.options button.selected{background:#126344;color:#fff}.feedback{font-weight:750;min-height:24px}.visual{font-size:54px;padding:13px}footer{text-align:center;color:#70917c;font-size:13px;padding:30px}@media(max-width:640px){header{padding:22px}main{margin:15px auto}}</style></head><body><header><a class="back" href="./index.html">← <span data-i18n="back">Вернуться на Eco Club</span></a><div class="top"><div><h1>EcoCraft</h1><p id="description"></p></div><div class="switch"><button data-lang="kk">ҚАЗ</button> <button data-lang="ru">РУС</button></div></div></header><main><div class="card"><p id="intro"></p></div><div class="grid" id="crafts"></div><div class="card"><p class="muted" id="safety"></p></div></main><footer>Eco Club · 2026–2027</footer><script>const items=[{e:'👜',ru:['Шоппер из полиэтиленовых пакетов','Чистые пакеты, ножницы, крючок','Нарежьте пакеты полосками. Соедините полоски в нить и свяжите сумку крючком.'],kk:['Полиэтилен пакеттерінен шоппер','Таза пакеттер, қайшы, ілмек','Пакеттерді жолақтарға кесіңіз. Жолақтардан жіп жасап, ілмекпен сөмке тоқыңыз.']},{e:'🪴',ru:['Кашпо из бутылки','ПЭТ-бутылка, краска, грунт','С помощью взрослого обрежьте бутылку, сделайте дренаж и украсьте кашпо.'],kk:['Бөтелкеден гүлсауыт','ПЭТ бөтелке, бояу, топырақ','Ересектің көмегімен бөтелкені кесіп, су ағатын тесік жасап, безендіріңіз.']},{e:'✏️',ru:['Органайзер из втулок','Картонные втулки, коробка, клей','Соедините втулки в коробке и украсьте для хранения карандашей.'],kk:['Картон түтіктерден органайзер','Картон түтік, қорап, желім','Түтіктерді қорапқа бекітіп, қарындаштарға арналған ыдысты безендіріңіз.']},{e:'🐦',ru:['Кормушка из упаковки','Промытая коробка, верёвка','Под присмотром взрослого сделайте отверстия и закрепите кормушку.'],kk:['Қаптамадан құс жемсауыты','Таза қорап, жіп','Ересек адамның көмегімен тесіктер жасап, жемсауытты бекітіңіз.']},{e:'🌼',ru:['Цветы из яичных лотков','Лотки, краски, клей','Вырежьте лепестки из чистых лотков, раскрасьте и соберите букет.'],kk:['Жұмыртқа қорабынан гүлдер','Қорап, бояу, желім','Таза қораптан күлтелер қиып, бояп, гүл шоғына біріктіріңіз.']},{e:'📦',ru:['Коробка для сортировки бумаги','Картонная коробка, бумага, маркеры','Украсьте коробку и подпишите, что в неё собирается сухая бумага.'],kk:['Қағаз сұрыптайтын қорап','Картон қорап, қағаз, маркер','Қорапты безендіріп, оған тек құрғақ қағаз жиналатынын жазыңыз.']}];const labels={ru:{back:'Вернуться на Eco Club',desc:'Вторая жизнь материалов: экологические поделки с пошаговыми инструкциями.',intro:'Выберите проект. Используйте только чистые и безопасные материалы.',materials:'Материалы',steps:'Как сделать',safety:'Безопасность: острые инструменты, резку пластика и горячий клей использовать только под контролем взрослого.'},kk:{back:'Eco Club сайтына оралу',desc:'Материалдарға екінші өмір: экологиялық бұйымдарды жасау нұсқаулығы.',intro:'Жобаны таңдаңыз. Тек таза әрі қауіпсіз материалдарды қолданыңыз.',materials:'Қажетті заттар',steps:'Жасалу жолы',safety:'Қауіпсіздік: өткір құралдар, пластик кесу және ыстық желімді тек ересектердің бақылауымен пайдаланыңыз.'}};let lang=new URLSearchParams(location.search).get('lang')||'ru';if(!labels[lang])lang='ru';function render(){let l=labels[lang];document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=l[e.dataset.i18n]);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.querySelector('#description').textContent=l.desc;document.querySelector('#intro').textContent=l.intro;document.querySelector('#safety').textContent=l.safety;document.querySelector('#crafts').innerHTML=items.map(it=>{let [n,m,s]=it[lang];return `<article class="card"><div class="visual">${it.e}</div><h2>${n}</h2><span class="tag">EcoCraft</span><p><b>${l.materials}:</b> ${m}</p><p><b>${l.steps}:</b> ${s}</p></article>`}).join('')}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});render();</script></body></html>
